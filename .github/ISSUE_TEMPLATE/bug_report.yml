name: Bug report
description: Something isn't working as expected
title: '[Bug] '
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Settings
        2. Toggle X
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: dropdown
    id: service
    attributes:
      label: Where does it happen
      options:
        - app (dashboard/web UI)
        - runner (speed tests / alert emails)
        - db / docker-compose setup
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse --short HEAD`, or the image tag you're running.
    validations:
      required: false

  - type: dropdown
    id: arch
    attributes:
      label: Architecture
      options:
        - x86-64
        - ARM64
        - Not sure
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs app` / `docker compose logs runner`, if relevant.
      render: shell
    validations:
      required: false
