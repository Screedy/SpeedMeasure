name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Both self-contained: no dependencies, no build step.
      - run: node --test shared/*.test.mjs
      - run: node runner/schedule.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci
          SESSION_SECRET: ci
      - run: docker build -f app/Dockerfile .
      - run: docker build -f runner/Dockerfile .
